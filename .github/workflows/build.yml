name: Build cross-clip (Windows & Android)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.NET 8)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test windows/CrossClip.sln --configuration Release --verbosity normal

      - name: Publish Single-File Executable
        run: dotnet publish windows/CrossClip/CrossClip.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o release-win

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-clip-windows
          path: release-win/CrossClip.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK (Release Signed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Generate Self-Signed Release Keystore
        if: "!hashFiles('android/app/release.keystore')"
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias crossclip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass crossclip123 \
            -keypass crossclip123 \
            -dname "CN=crossclip, OU=crossclip, O=crossclip, L=City, S=State, C=US"

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest

      - name: Build Release Signed APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cross-clip.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-clip-android
          path: cross-clip.apk
          if-no-files-found: error
